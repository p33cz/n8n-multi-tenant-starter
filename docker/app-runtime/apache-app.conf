# Vhost appky uvnitř kontejneru app-{klient}-{appka} — naslouchá na 8080,
# ven appku vystavuje až Apache na hostiteli (viz templates/app-vhost.conf.tmpl).
#
# Bezpečnostní výchozí stav: DENY VŠECHNO, pak explicitně povol jen známé
# "bezpečné" typy souborů (allowlist, ne blacklist). Appka může obsahovat víc
# vygenerovaných webů jako podsložky (agency-ws.ai.avitona.cz/moje-firma/...)
# a některé z nich si tam ukládají podpůrná data (JSON nastavení, hesla) —
# ty nesmí být dostupné přes URL, ať se appka/web jmenuje jakkoli a ať na
# to sama nezapomene ošetřit vlastním .htaccess (AllowOverride All níž jí
# to pořád umožňuje, jako doplňkovou vrstvu, ne náhradu za tohle).
<VirtualHost *:8080>
    DocumentRoot /code

    <Directory /code>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all denied

        <FilesMatch "\.(html?|css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|php)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # config soubory (secrety čtené přes `require`/`include` z PHP, ne
    # určené k přímému stažení) a jakákoli "data/"/"private/" složka jsou
    # zakázané i přesto, že by jejich přípona jinak prošla allowlistem výše.
    <Files "mail-config.php">
        Require all denied
    </Files>
    <DirectoryMatch "/(data|private)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/app_error.log
    CustomLog ${APACHE_LOG_DIR}/app_access.log combined
</VirtualHost>
