# Vhost for an app inside container app-{client}-{app} — listens on
# 8080, the host's Apache is what exposes the app to the outside (see
# templates/app-vhost.conf.tmpl).
#
# Default security posture: DENY EVERYTHING, then explicitly allow
# only known "safe" file types (an allowlist, not a blacklist). An app
# can hold several generated sites as subdirectories
# (client-app.example.com/site-name/...), and some of them may store
# supporting data there (JSON settings, passwords) — that data must
# not be reachable over the URL, no matter what the app/site is called
# and whether it remembers to protect it itself via its own .htaccess
# (AllowOverride All below still lets it, as an extra layer, not a
# replacement for this).
<VirtualHost *:8080>
    DocumentRoot /code

    <Directory /code>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all denied

        <FilesMatch "\.(html?|css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|php)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Config files (secrets read via PHP `require`/`include`, not meant
    # for direct download) and any "data/"/"private/" directory are
    # denied even though their extension would otherwise pass the
    # allowlist above.
    <Files "mail-config.php">
        Require all denied
    </Files>
    <DirectoryMatch "/(data|private)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/app_error.log
    CustomLog ${APACHE_LOG_DIR}/app_access.log combined
</VirtualHost>
