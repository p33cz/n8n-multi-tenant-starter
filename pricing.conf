# pricing.conf — Anthropic API price in USD per 1,000,000 tokens, per model.
# Columns (space-separated):
#   model  input  output  cache_write_5m  cache_read
#
# cache_write_5m = writing to the prompt cache (5min TTL) = 1.25x input
# cache_read     = reading from the cache = 0.10x input
#
# Price source (verified 2026-09-06, Anthropic's pricing page):
#   Opus 4.8 : $5 / $25 per 1M (in/out)
#   Sonnet 5 : $3 / $15 per 1M (in/out)  — note: the $2/$10 launch promo ended 2026-08-31, standard pricing applies
#   Haiku 4.5: $1 / $5  per 1M (in/out)
#
# When Anthropic changes its pricing, update the numbers below. Lines
# starting with # are comments.
# An unknown model in usage.log → usage-report.sh lists it at $0 and warns.
#
# NOTE: prices for the "5" series models (opus-5 / sonnet-5 new gen /
# haiku-5) below are an ESTIMATE (carried over from the Opus/Sonnet/Haiku
# tier). Once the official pricing is out, verify and update.
#
