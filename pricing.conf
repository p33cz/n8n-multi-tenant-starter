# pricing.conf — cena Anthropic API v USD za 1 000 000 tokenů, per model.
# Sloupce (mezerami oddělené):
#   model  input  output  cache_write_5m  cache_read
#
# cache_write_5m = zápis do promptové cache (5min TTL) = 1.25× input
# cache_read     = čtení z cache = 0.10× input
#
# Zdroj cen (ověřeno 2026-09-06, ceník Anthropic):
#   Opus 4.8 : $5 / $25 za 1M (in/out)
#   Sonnet 5 : $3 / $15 za 1M (in/out)  — pozn.: úvodní akce $2/$10 skončila 2026-08-31, platí standard
#   Haiku 4.5: $1 / $5  za 1M (in/out)
#
# Až Anthropic ceník změní, uprav čísla níže. Řádky začínající # jsou komentáře.
# Neznámý model ve usage.log → usage-report.sh ho vypíše s cenou 0 a upozorní.
#
# POZOR: ceny modelů řady "5" (opus-5 / sonnet-5 nová gen / haiku-5) níže jsou
# ODHAD (převzato z tieru Opus/Sonnet/Haiku). Až vyjde oficiální ceník, ověř a uprav.
#
# model                input   output   cache_write   cache_read
claude-opus-5           5.00    25.00    6.25          0.50
claude-opus-4-8         5.00    25.00    6.25          0.50
claude-opus-4-8[1m]     5.00    25.00    6.25          0.50
claude-sonnet-5         3.00    15.00    3.75          0.30
claude-haiku-4-5        1.00     5.00    1.25          0.10
claude-haiku-4-5-20251001  1.00  5.00   1.25          0.10
